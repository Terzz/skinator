<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skinator local</title>
<meta name="description" content="Skinator : essaie les couleurs, les objets et les dragodindes de ton perso Dofus Retro, puis exporte-le en PNG ou en GIF.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%231d1b18'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('skinator_theme') === 'dark' ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
<style>
  /* Geist (Vercel, licence OFL), sous-ensemble latin de Google Fonts, servie avec la page : une seule requête, pas de
     feuille de style externe qui retarde l'affichage. Une police variable : les graisses 400 et 500. Ouverte en fichier
     (file://), la page peut se voir refuser la police locale : la même chez Google prend le relais */
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url(fonts/geist-latin.woff2) format("woff2"), url(https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwcGFWNOITd.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* identité des exports : papier ivoire, une seule police (Geist), petites capitales, filets fins, rien d'ajouté */
  :root {
    --bg: #f6f3ee; --panel: #fbfaf7; --stage: #ffffff; --ink: #1d1b18; --muted: #716a60; --line: #ddd7cd;
    --btn: #1d1b18; --btn-ink: #f6f3ee; --ring: #d3ccc0; --veil: rgba(29, 27, 24, .35);
    --check-a: #ece9e2; --check-b: #f8f6f2; --chip: #efebe4; --thumb: transparent;
    --accent: var(--btn); --accent-ink: var(--btn-ink); --card: var(--panel);
    color-scheme: light;
  }
  :root[data-theme="dark"] {                    /* bouton clair / sombre de l'en-tête */
    --bg: #161519; --panel: #1f1e23; --stage: #1f1e23; --ink: #ecebf0; --muted: #a29fab; --line: #34323a;
    --btn: #ecebf0; --btn-ink: #161519; --ring: #6b6774; --veil: rgba(0, 0, 0, .6);
    --check-a: #26252b; --check-b: #2e2d33; --chip: #2a2735; --thumb: #d9d6cf;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  input[type=checkbox], input[type=range] { accent-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  ::placeholder { color: var(--muted); opacity: 1; }
  .wrap { max-width: 1520px; margin: 0 auto; padding: 22px 40px 28px; display: flex; flex-direction: column; gap: 22px; }
  @media (max-width: 700px) { .wrap { padding: 16px 16px 24px; } }
  .caps { font-size: 11px; line-height: 16px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  select, input[type=text], input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
  select { width: 100%; }
  .btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 10px 16px; line-height: 20px; cursor: pointer; min-height: 42px; }
  select { min-height: 42px; }
  .btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 500; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .link { background: transparent; border: 0; padding: 0; font-size: 12px; line-height: 16px; color: var(--muted); cursor: pointer; }
  .link:hover { color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 9px 14px; line-height: 20px; cursor: pointer; }
  /* survol : le même retour que le bouton du thème, sauf sur le bouton principal et le segment choisi */
  .btn:not(.primary):not(:disabled):hover, .seg button:not([aria-pressed="true"]):not(:disabled):hover { background: var(--chip); }
  input[type=checkbox] { margin: 0; }           /* la marge du navigateur décalait Miroir et « défaut » */
  .thumb:empty { background: transparent; }     /* case vide : pas de carré clair en sombre */
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
  .seg button:disabled { opacity: .4; cursor: default; }
  .seg button:focus-visible { outline-offset: -4px; }                         /* dans le bouton : le segment rogne le dehors */
  .seg button[aria-pressed="true"]:focus-visible { outline-color: var(--btn-ink); }
  .dim { opacity: .45; pointer-events: none; }
  .meta { color: var(--muted); font-size: 12px; }

  /* en-tête */
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
  header.top .brand { font-size: 11px; font-weight: 500; letter-spacing: 3.5px; color: var(--muted); margin-right: 12px; min-width: 82px; }
  header.top .who { display: flex; gap: 8px; align-items: center; min-width: 0; }
  header.top select { width: 340px; min-width: 0; max-width: 100%; }
  header.top .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  @media (min-width: 701px) and (max-width: 1180px) {   /* l'en-tête reste sur une ligne : le menu des persos se resserre */
    header.top select { width: 250px; }
  }
  @media (min-width: 701px) and (max-width: 1039px) {   /* tablette : deux rangs qui finissent au même bord droit */
    header.top .who { flex: 1 1 auto; }
    header.top .who select { flex: 1 1 250px; width: auto; max-width: none; }
  }
  /* menu Exporter : les exports moins courants, chacun avec ce qu'il produit */
  .menuwrap { position: relative; display: flex; }
  #exportBtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  #exportLbl { font-variant-numeric: tabular-nums; }
  #exportBtn[aria-expanded="true"] { border-color: var(--ink); }
  .menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 20; width: 235px; box-sizing: border-box; padding: 6px;   /* bord gauche = bord de la colonne */
          background: var(--stage); border: 1px solid var(--ring); border-radius: 10px; display: flex; flex-direction: column; }
  .menu[hidden] { display: none; }
  .menu button { font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 6px; padding: 9px 10px;
                 text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
  .menu button:hover { background: var(--chip); }
  .menu button:focus-visible { background: var(--chip); outline: 2px solid var(--ink); outline-offset: -2px; }
  .menu button > span:first-child { line-height: 20px; }
  .menu .sub { font-size: 12px; line-height: 18px; color: var(--muted); }
  .theme { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink);
           padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .theme:hover { background: var(--chip); }
  @media (max-width: 700px) {
    header.top .brand { margin-right: auto; }
    .theme { width: 44px; height: 44px; }
    header.top .who { width: 100%; }
    header.top select { min-width: 0; width: auto; flex: 1 1 0; max-width: none; }
    .menuwrap > .btn { flex: 1; }
    header.top .actions { width: 100%; margin-left: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    header.top .actions .primary { order: -1; grid-column: 1 / -1; }   /* l'export principal seul, puis les deux autres */
  }

  /* corps : l'aperçu en grand, une colonne de réglages (sous l'aperçu sur un téléphone) */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 36px; align-items: start; }
  .stage { min-width: 0; background: var(--stage); border: 1px solid var(--line);
           border-radius: 14px; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .stagebar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; color: var(--muted); font-size: 13px; }
  .stagebar .zoom { display: flex; align-items: center; gap: 8px; }
  .stagebar input[type=range] { width: 120px; accent-color: var(--ink); }
  .stagebar #zoomv { min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }   /* le curseur ne bouge plus */
  #stagebox { flex: 1 1 0; min-height: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stagebox[data-fond="damier"] { background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) center / 20px 20px; }
  #stagebox[data-fond="clair"] { background: #ffffff; } #stagebox[data-fond="sombre"] { background: #22201f; } #stagebox[data-fond="herbe"] { background: #7d9b47; }
  #stagebox.anim { cursor: pointer; }
  #stage { width: auto; height: auto; max-width: 100%; max-height: 100%; }   /* le perso tient toujours dans le cadre */
  .pill { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .pill .seg { border: 0; border-radius: 0; }
  .pill .seg + .seg { border-left: 1px solid var(--line); }
  .pill .seg button { padding: 9px 16px; }
  aside.side { min-width: 0; display: flex; flex-direction: column; }
  @media (max-width: 1039px) {                  /* réglages sous l'aperçu */
    .layout { grid-template-columns: minmax(0, 1fr); }
    .stage { height: auto; }
    #stagebox { flex: none; height: min(62vh, 640px); height: round(down, min(62vh, 640px), 1px); min-height: 320px; }
  }
  @media (max-width: 560px) {                   /* téléphone : la pilule sur deux rangs nets */
    .pill { align-self: stretch; flex-direction: column; border-radius: 12px; }
    .pill .seg { display: grid; }
    .pill #pose { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .pill .seg button { padding: 10px 0; white-space: nowrap; font-size: 13px; }
    .pill .seg + .seg { border-left: 0; border-top: 1px solid var(--line); }
    #stagebox { height: min(48vh, 420px); height: round(down, min(48vh, 420px), 1px); min-height: 260px; }
  }
  aside.side > section { display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  aside.side > section:first-child { padding-top: 0; }
  aside.side > section:last-child { border-bottom: 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .duo .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .duo .seg button { padding: 9px 0; }

  /* couleurs : pastille (clic = sélecteur), numéro, code, défaut */
  .colors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .color { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .color input[type=color] { -webkit-appearance: none; appearance: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
                             background: none; cursor: pointer; box-shadow: inset 0 0 0 1px var(--ring); }
  .color input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .color input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--ring); }
  .color input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }
  .color input[type=color]:disabled { cursor: default; opacity: .55; }
  .color .num { font-size: 11px; line-height: 16px; letter-spacing: 2px; padding-left: 2px; color: var(--muted); margin-top: 2px; }   /* 2px : l'espacement après le dernier « I » */
  .color input[type=text] { width: 100%; max-width: 104px; text-align: center; font-weight: 500; letter-spacing: .8px; padding: 4px 6px; line-height: 20px; text-transform: uppercase;
                            background: transparent; border-color: transparent; }
  .color input[type=text]:hover, .color input[type=text]:focus { border-color: var(--line); background: var(--panel); }
  .color input[type=text]:disabled { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .color .def { font-size: 12px; line-height: 16px; color: var(--muted); display: flex; gap: 8px; align-items: center; cursor: pointer; }

  /* équipement : 4 tuiles */
  #equip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .slot.monture { grid-column: 1 / -1; }
  .slot .thumb svg { width: 42px; height: 42px; }
  .slot { position: relative; padding: 10px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 66px; }
  .slot:hover, .slot:focus-within { border-color: var(--ink); }
  .slot .pick { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; width: 100%; background: transparent;
                border: 0; padding: 0; text-align: left; cursor: pointer; }
  .slot .txt { display: flex; flex-direction: column; min-width: 0; }
  .slot .thumb { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--thumb); border-radius: 6px; }
  .slot .thumb img { max-width: 42px; max-height: 42px; object-fit: contain; }
  .slot .what { font-size: 12px; line-height: 16px; color: var(--muted); padding-right: 20px; }   /* la croix est sur cette ligne */
  .slot .name { font-weight: 500; line-height: 18px; overflow-wrap: break-word; hyphens: manual;   /* 2 lignes au plus, nom entier en title */
                display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .slot .lvl { margin-top: 8px; display: flex; gap: 6px; align-items: center; font-size: 12px; line-height: 16px; color: var(--muted); }
  .slot .lvl select { width: auto; max-width: 100%; min-height: 0; height: 24px; padding: 0 6px; font-size: 12px; }
  .slot [data-off] { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: transparent;
                     color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .slot [data-off]:hover { background: var(--chip); color: var(--ink); }

  /* vue, team */
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; color: var(--muted); font-size: 13px; }
  .row label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .fonds { display: flex; gap: 8px; align-items: center; }
  .fonds button { width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px var(--ring); }
  .fonds button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--ring), 0 0 0 2px var(--bg), 0 0 0 3px var(--ink); }
  .fonds button:focus-visible { outline-offset: 4px; }                         /* le focus ne ressemble pas au fond choisi */
  .fonds [data-v="damier"] { background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 10px 10px; }
  .fonds [data-v="clair"] { background: #ffffff; } .fonds [data-v="sombre"] { background: #22201f; } .fonds [data-v="herbe"] { background: #7d9b47; }
  .teamrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }   /* titre à la même distance du filet que les autres sections */
  .teamrow .t { display: flex; flex-direction: column; }
  .teamrow .meta { line-height: 16px; }

  /* choix d'objet */
  #picker { position: fixed; inset: 0; background: var(--veil); display: none; z-index: 10; padding: 24px 16px; }
  #picker.open { display: flex; justify-content: center; }
  #picker .box { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; }
  #picker header { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #picker header h2 { font-size: 15px; line-height: 22px; font-weight: 500; margin: 0; }
  #picker header input { flex: 1; min-width: 160px; }
  #pickerSearch, #pickerFilter, #pickerCame, #pipZoom, #skinName { min-height: 42px; }   /* même hauteur que les boutons voisins */
  #pickerCount { margin-right: auto; }          /* Rien et Fermer au bord droit, comme dans les autres fenêtres */
  @media (max-width: 900px) { #picker header input { flex: 1 1 55%; } }
  #picker .grid { overflow: auto; padding: 12px 14px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .card:hover, .card[aria-current="true"] { border-color: var(--ink); }
  .card[aria-current="true"] { box-shadow: 0 0 0 1px var(--ink) inset; }
  .card .pic { height: 78px; display: flex; align-items: center; justify-content: center; background: var(--thumb); border-radius: 6px; }
  .card .pic img { max-width: 100%; max-height: 78px; object-fit: contain; }
  .card .pic svg { width: 100%; height: 74px; }
  .card .sw { display: flex; gap: 3px; padding-top: 1px; }
  .card .sw i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--ring); display: block; }
  #picker [hidden] { display: none !important; }
  .card .nm { font-size: 11.5px; line-height: 14px; height: 28px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }   /* 2 lignes réservées : le numéro au même y */
  .card .id { font-size: 10.5px; line-height: 14px; color: var(--muted); }
  /* team */
  #teambox, #skinsbox, #cmpbox, #pipbox { position: fixed; inset: 0; background: var(--veil); display: none; z-index: 10; padding: 24px 16px; }
  #teambox.open, #skinsbox.open, #cmpbox.open, #pipbox.open { display: flex; justify-content: center; align-items: flex-start; }
  #teambox .box, #skinsbox .box, #cmpbox .box, #pipbox .box { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; }
  #teambox header, #skinsbox header, #cmpbox header, #pipbox header { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #teambox header h2, #skinsbox header h2, #cmpbox header h2, #pipbox header h2 { font-size: 15px; line-height: 22px; font-weight: 500; margin: 0; flex: 1; }
  #teambox .body, #skinsbox .body, #cmpbox .body, #pipbox .body { overflow: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .members { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .member { font-size: 12px; line-height: 17px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .member .fixed { border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; line-height: 22px; color: var(--ink); background: var(--panel);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 42 px comme les menus voisins */
  .member select { text-overflow: ellipsis; }
  #cmpbox .members { grid-template-columns: repeat(2, minmax(0, 260px)); justify-content: center; }   /* chaque menu au-dessus de sa carte */
  @media (min-width: 1040px) { #teamMembers { grid-template-columns: repeat(4, minmax(0, 1fr)); } }   /* 8 persos : 4 + 4 */
  .mtiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  #teamGrid .tcard { position: relative; }
  .tdel { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%;
          background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .tdel i { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; }
  .tdel:hover, .tdel:focus-visible { color: var(--ink); }
  .tdel:focus-visible { outline-offset: 0; }    /* l'anneau ne touche pas le bord de la carte */
  .tdel:hover i, .tdel:focus-visible i { border-color: var(--ink); }
  .mtile { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; align-items: center; padding: 4px; min-height: 38px;
           border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); cursor: pointer; text-align: left; }
  .mtile:hover, .mtile:focus-visible { border-color: var(--ink); }
  .mtile .thumb { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: var(--thumb); border-radius: 4px; }
  .mtile .thumb img { max-width: 26px; max-height: 26px; object-fit: contain; }
  .mtile.monture { grid-column: 1 / -1; }
  #teamPose button { padding: 4px 10px; font-size: 12px; }
  .mtile .thumb svg { width: 26px; height: 26px; }
  .mtile .txt { display: flex; flex-direction: column; min-width: 0; }
  .mtile .what { font-size: 10.5px; line-height: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtile .name { font-size: 11.5px; line-height: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tcard .own { font-size: 11.5px; color: var(--muted); line-height: 15px; }
  .tcard .acts { align-self: stretch; margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }   /* Mes skins : boutons alignés en bas */
  .tcard [data-act="del"][data-sure] { border-color: var(--ink); }   /* suppression armée */
  #teamGrid .tcard [data-open] { margin-top: auto; }   /* « Ouvrir ce perso » au même y dans une rangée */

<script>
// le code et ses données se chargent juste après le premier affichage : la page apparaît sans les attendre (dans
// l'ordre : async = false). Dans un onglet en arrière-plan, sans image à afficher, le délai de secours prend le relais
(() => {
  let done = false;
  const go = () => {
    if (done) return; done = true;
    for (const f of ['data/meta.js', 'data/persos.js', 'data/catalogue.js', 'data/montures.js', 'app.js']) {
      const sc = document.createElement('script'); sc.src = f; sc.async = false; document.body.appendChild(sc);
    }
  };
  requestAnimationFrame(() => setTimeout(go)); setTimeout(go, 300);
})();
</script>
